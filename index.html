  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      overflow: hidden;
      background: #060913;
      color: #f8fafc;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass-ui {
      background: rgba(10, 15, 29, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.28);
    }
    /* Sleek In-Scene 3D Callout Badges */
    .room-tag-3d {
      position: absolute;
      transform: translate(-50%, -100%);
      pointer-events: none;
      transition: opacity 0.25s ease;
      white-space: nowrap;
      z-index: 25;
    }
    .room-tag-bubble {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px -2px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .room-tag-pin {
      width: 2px;
      height: 18px;
      background: linear-gradient(180deg, #f59e0b, transparent);
      margin: 0 auto;
    }
    .room-tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      margin: -2px auto 0;
    }
    .hazard-stripe {
      background: repeating-linear-gradient(
        -45deg,
        #f59e0b,
        #f59e0b 10px,
        #0f172a 10px,
        #0f172a 20px
      );
    }
    /* Horizontal Scrollbar hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .timer-ring-fill {
      transition: width 0.1s linear;
    }
    .badge-pop {
      animation: badgePop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes badgePop {
      0% { opacity: 0; transform: translate(-50%, -85%) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, -100%) scale(1); }
    }

    /* Pie-Chart / CAD Architectural Leader Line Callout */
    #leader-line-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 24;
    }
    .callout-line {
      stroke: #f59e0b;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.7));
    }
    .callout-line-secondary {
      stroke: #64748b;
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
      fill: none;
      opacity: 0.55;
    }
    .callout-card {
      position: absolute;
      pointer-events: none;
      z-index: 25;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
    }

    function buildConstructionSite() {
      // Ground plane
      const ground = new THREE.Mesh(
        new THREE.BoxGeometry(50, 0.5, 45),
        new THREE.MeshStandardMaterial({ color: 0x090e1c, roughness: 0.9 })
      );
      ground.position.y = -0.25;
      ground.receiveShadow = true;
      scene.add(ground);

      // Safety Engineering Construction Grid
      const grid = new THREE.GridHelper(70, 35, 0xf59e0b, 0x1e293b);
      grid.position.y = 0.02;
      scene.add(grid);

      // Deep Basement Foundation Excavation Pit
      const pit = new THREE.Mesh(
        new THREE.BoxGeometry(22, 1.2, 17),
        new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 1.0 })
      );
      pit.position.set(0, -0.6, 0);
      scene.add(pit);

      // Heavy Safety Barricades around Site
      const coneMat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
      const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      for (let c = -16; c <= 16; c += 4) {
        const cone = new THREE.Group();
        const coneBody = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.7, 10), coneMat);
        coneBody.position.y = 0.35;
        const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.15, 10), whiteMat);
        stripe.position.y = 0.35;
        cone.add(coneBody, stripe);
        cone.position.set(c, 0, 13);
        scene.add(cone);
      }
    }

    function buildTowerCrane() {
      towerCrane = new THREE.Group();
      towerCrane.position.set(-15, 0, -10);

      const steelMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.6, roughness: 0.3 });

      // Concrete Crane Base
      const cBase = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.8, 4.5), new THREE.MeshStandardMaterial({ color: 0x334155 }));
      cBase.position.y = 0.4;
      towerCrane.add(cBase);

      // Tall 38m Mast to clear 10 storeys
      const mastHeight = 36;
      const mast = new THREE.Mesh(new THREE.BoxGeometry(1.6, mastHeight, 1.6), steelMat);
      mast.position.y = mastHeight / 2 + 0.4;
      towerCrane.add(mast);

      // Slew Turntable & Jib
      craneJib = new THREE.Group();
      craneJib.position.set(0, mastHeight + 0.4, 0);

      // Operator Cabin
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.5), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }));
      cabin.position.set(0.9, 0.9, 1.0);
      craneJib.add(cabin);

      // Long Working Jib Arm
      const jibArm = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 30), steelMat);
      jibArm.position.set(0, 1.2, 12);
      craneJib.add(jibArm);

      // Counter-Jib & Concrete Counterweight
      const counterJib = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 10), steelMat);
      counterJib.position.set(0, 1.2, -6);
      const counterWeight = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.0, 3.2), new THREE.MeshStandardMaterial({ color: 0x475569 }));
      counterWeight.position.set(0, 2.0, -9);
      craneJib.add(counterJib, counterWeight);

      // Hoist Cable & Hook with Precast Beam
      craneHook = new THREE.Group();
      craneHook.position.set(0, 0, 15);

      const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 10, 8), darkSteel);
      cable.position.y = -4.5;
      const beam = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.4, 0.5), new THREE.MeshStandardMaterial({ color: 0x94a3b8 }));
      beam.position.y = -9.5;
      craneHook.add(cable, beam);
      craneJib.add(craneHook);

      towerCrane.add(craneJib);
      scene.add(towerCrane);
    }

    function buildAllTenFloors() {
      for (let i = 0; i < TOTAL_LEVELS; i++) {
        const floorGroup = new THREE.Group();
        // i=0 is Basement (Y: 0.1), i=1 is Ground Floor (Y: 2.9), up to i=9 is 8th Floor
        const yPos = i * (FLOOR_H + 0.2) + 0.1;
        floorGroup.position.set(0, yPos, 0);
        floorGroup.userData = { defaultY: yPos, index: i };

        // RCC Floor Slab
        const slabColor = (i === 0) ? 0x1e293b : (i === 1 ? 0x0f172a : 0x0c1427);
        const slab = new THREE.Mesh(
          new THREE.BoxGeometry(SLAB_W, 0.28, SLAB_L),
          new THREE.MeshStandardMaterial({ color: slabColor, roughness: 0.7 })
        );
        slab.receiveShadow = true;
        slab.castShadow = true;
        floorGroup.add(slab);

        // Ceiling Slab (hidden when floor is individually inspected)
        const ceiling = new THREE.Mesh(
          new THREE.BoxGeometry(SLAB_W, 0.18, SLAB_L),
          new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 })
        );
        ceiling.position.y = FLOOR_H;
        floorGroup.add(ceiling);
        floorCeilings.push(ceiling);

        // Architectural Glass Curtain Wall
        const glass = new THREE.Mesh(
          new THREE.BoxGeometry(SLAB_W - 0.1, FLOOR_H - 0.15, SLAB_L - 0.1),
          new THREE.MeshPhysicalMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.16,
            roughness: 0.1,
            transmission: 0.7,
            side: THREE.DoubleSide
          })
        );
        glass.position.y = FLOOR_H / 2;
        floorGroup.add(glass);

        // RCC Columns
        const colMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
        [
          [-SLAB_W/2 + 0.5, -SLAB_L/2 + 0.5],
          [SLAB_W/2 - 0.5, -SLAB_L/2 + 0.5],
          [-SLAB_W/2 + 0.5, SLAB_L/2 - 0.5],
          [SLAB_W/2 - 0.5, SLAB_L/2 - 0.5],
          [0, -SLAB_L/2 + 0.5],
          [0, SLAB_L/2 - 0.5]
        ].forEach(([cx, cz]) => {
          const col = new THREE.Mesh(new THREE.BoxGeometry(0.45, FLOOR_H, 0.45), colMat);
          col.position.set(cx, FLOOR_H / 2, cz);
          floorGroup.add(col);
        });

        // Build specific units for this exact floor
        buildFloorInterior(floorGroup, i);

        // External Steel Scaffolding Tubes
        const scaffold = buildFloorScaffold(SLAB_W, SLAB_L, FLOOR_H);
        floorGroup.add(scaffold);
        scaffoldGroups.push(scaffold);

        scene.add(floorGroup);
        floorGroups.push(floorGroup);
      }
    }

    // Helper: Scaffolding tubes
    function buildFloorScaffold(w, l, h) {
      const scaffold = new THREE.Group();
      const pipeMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.6, roughness: 0.4 });
      const plankMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.8 });

      const xSpan = w / 2 + 0.7;
      const zSpan = l / 2 + 0.7;

      [-zSpan, zSpan].forEach(zPos => {
        for (let x = -xSpan; x <= xSpan; x += 3.6) {
          const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, h, 6), pipeMat);
          pipe.position.set(x, h / 2, zPos);
          scaffold.add(pipe);
        }
        const plank = new THREE.Mesh(new THREE.BoxGeometry(w + 1.4, 0.08, 0.65), plankMat);
        plank.position.set(0, h * 0.45, zPos);
        scaffold.add(plank);
      });
      return scaffold;
    }

    function createHumanFigure(config = {}) {
      const figure = new THREE.Group();
      figure.position.set(config.x || 0, config.y || 0, config.z || 0);
      figure.rotation.y = config.rotY || 0;

      const isSitting = config.isSitting !== undefined ? config.isSitting : true;
      const role = config.role || 'analyst';
      const hasHeadset = config.hasHeadset || false;

      let shirtMat = peopleMats.analystBlue;
      let pantsMat = peopleMats.darkPants;
      let hasBeret = false;

      if (role === 'police') {
        shirtMat = peopleMats.policeKhaki;
        pantsMat = peopleMats.policePants;
        hasBeret = true;
      } else if (role === 'executive') {
        shirtMat = peopleMats.suitBlack;
        pantsMat = peopleMats.darkPants;
      } else if (role === 'visitor') {
        shirtMat = peopleMats.visitorShirt;

          badge.position.set(0, pelvisY + 0.16, 0.085);

        }

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.06, 6), peopleMats.skin);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), peopleMats.skin);

        if (hasBeret) {

        if (hasHeadset) {
          const band = new THREE.Mesh(new THREE.TorusGeometry(0.095, 0.012, 4, 12, Math.PI), peopleMats.headsetMat);
          band.rotation.x = Math.PI / 2;
          band.position.set(0, pelvisY + 0.45, 0);

          figure.add(band, mic);
        }

        [-0.15, 0.15].forEach(ax => {

          upperArm.position.set(ax, pelvisY + 0.20, 0.04);

          const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.18), peopleMats.skin);

        [-0.07, 0.07].forEach(lx => {

    function createErgonomicChair(x, z, rotY = 0, isExecutive = false) {

      const seatMat = isExecutive ? furnitureMats.leatherSeat : furnitureMats.chairSeat;

      const seatW = isExecutive ? 0.44 : 0.38;

      back.position.set(0, 0.34 + backH / 2, -seatD / 2 + 0.02);

    function createWorkstation(x, z, rotY = 0, options = {}) {
      const station = new THREE.Group();

      const w = options.width || 1.4;
      const d = options.depth || 0.7;

      const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.04, d), deskMat);
      top.position.y = h;
      station.add(top);

      [-w / 2 + 0.04, w / 2 - 0.04].forEach(lx => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.04, h - 0.02, d - 0.08), furnitureMats.metalFrame);
        leg.position.set(lx, h / 2, 0);
        station.add(leg);
      });

      const modesty = new THREE.Mesh(new THREE.BoxGeometry(w - 0.1, h * 0.55, 0.02), deskMat);
      modesty.position.set(0, h * 0.65, -d / 2 + 0.04);
      station.add(modesty);

      const screenCount = options.screens || 2;
      const screenGlow = options.screenGlow || furnitureMats.screenGlowCyan;
      const monOffset = screenCount === 1 ? [0] : [-0.26, 0.26];

      monOffset.forEach((sx, idx) => {
        const stand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.015, 0.1), furnitureMats.metalFrame);
        stand.position.set(sx, h + 0.02, -d * 0.2);
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.16, 0.02), furnitureMats.metalFrame);
        post.position.set(sx, h + 0.09, -d * 0.2);

        screenBezel.position.set(sx, h + 0.22, -d * 0.2);
        if (screenCount > 1) {
          screenBezel.rotation.y = idx === 0 ? 0.15 : -0.15;
        }

        const screenFace = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.21), screenGlow);
        screenFace.position.set(sx, h + 0.22, -d * 0.2 + 0.012);
        if (screenCount > 1) {
          screenFace.rotation.y = idx === 0 ? 0.15 : -0.15;
        }

        station.add(stand, post, screenBezel, screenFace);
      });

      const kb = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.01, 0.12), furnitureMats.screenBezel);
      kb.position.set(0, h + 0.025, 0.05);
      station.add(kb);

      tower.position.set(w / 2 - 0.16, 0.17, 0.05);
      station.add(tower);

      const chair = createErgonomicChair(0, 0.44, 0, options.isExecutive);
      station.add(chair);

      if (options.hasPerson !== false) {
        const seatedOfficer = createHumanFigure({
          x: 0,
          y: 0,
          z: 0.38,
          rotY: 0,
          isSitting: true,
          role: options.personRole || (options.isExecutive ? 'executive' : 'analyst'),
          hasHeadset: options.hasHeadset || false
        });
        station.add(seatedOfficer);
      }

      return station;
    }

    function createConferenceSuite(x, z, length = 3.6, width = 1.6, chairCount = 8) {
      const suite = new THREE.Group();
      suite.position.set(x, 0, z);

      const tableH = 0.58;
      const top = new THREE.Mesh(new THREE.BoxGeometry(length, 0.05, width), furnitureMats.executiveWood);
      top.position.y = tableH;
      suite.add(top);

      const wireWell = new THREE.Mesh(new THREE.BoxGeometry(length * 0.6, 0.01, 0.18), furnitureMats.metalFrame);
      wireWell.position.set(0, tableH + 0.026, 0);
      suite.add(wireWell);

      [-length / 3, length / 3].forEach(px => {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.3, tableH, width * 0.4), furnitureMats.metalFrame);
        pillar.position.set(px, tableH / 2, 0);
        suite.add(pillar);
      });

      const chairsPerSide = Math.floor((chairCount - 2) / 2);
      const xSpacing = (length - 0.8) / (chairsPerSide - 1 || 1);

      for (let i = 0; i < chairsPerSide; i++) {
        const cx = -length / 2 + 0.4 + i * xSpacing;
        suite.add(createErgonomicChair(cx, -width / 2 - 0.34, Math.PI, true));
        suite.add(createErgonomicChair(cx, width / 2 + 0.34, 0, true));

        if (i % 2 === 0) {
          suite.add(createHumanFigure({ x: cx, z: -width / 2 - 0.30, rotY: 0, isSitting: true, role: 'police' }));
        } else {
          suite.add(createHumanFigure({ x: cx, z: width / 2 + 0.30, rotY: Math.PI, isSitting: true, role: 'analyst' }));
        }
      }
      suite.add(createErgonomicChair(-length / 2 - 0.36, 0, Math.PI / 2, true));
      suite.add(createHumanFigure({ x: -length / 2 - 0.32, z: 0, rotY: Math.PI / 2, isSitting: true, role: 'police' }));

      suite.add(createErgonomicChair(length / 2 + 0.36, 0, -Math.PI / 2, true));
      suite.add(createHumanFigure({ x: length / 2 + 0.32, z: 0, rotY: -Math.PI / 2, isSitting: true, role: 'executive' }));

      return suite;
    }

    function createMarkerObjectByName(name, x, z, rotY = 0) {
      const text = name.toLowerCase();

        return createPolicePatrolCar(x, z, rotY);
      }
      if (text.includes('genset') || text.includes('ups') || text.includes('electrical') || text.includes('substation')) {
        const unit = new THREE.Group();
        unit.position.set(x, 0, z);
        unit.rotation.y = rotY;
        const cabinet = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.9), new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.5 }));
        cabinet.position.y = 0.6;

        panel.position.set(0, 1.1, 0.46);
        unit.add(cabinet, panel);
        return unit;
      }
      if (text.includes('visitor') || text.includes('desk') || text.includes('reception') || text.includes('public') || text.includes('facilitation')) {
        return createWorkstation(x, z, rotY, { width: 1.8, depth: 0.8, screens: 1, screenGlow: furnitureMats.screenGlowCyan, personRole: 'visitor' });
      }
      if (text.includes('dispatch') || text.includes('response') || text.includes('call') || text.includes('helpline') || text.includes('erss')) {
        return createWorkstation(x, z, rotY, { width: 1.7, screens: 2, screenGlow: furnitureMats.screenGlowRed, personRole: 'calltaker', hasHeadset: true });
      }
      if (text.includes('scrb') || text.includes('cctns') || text.includes('crime') || text.includes('analytics') || text.includes('fingerprint') || text.includes('afis')) {
        return createWorkstation(x, z, rotY, { width: 1.8, screens: 2, screenGlow: furnitureMats.screenGlowCyan, personRole: 'analyst' });
      }
      if (text.includes('ai') || text.includes('ml') || text.includes('video') || text.includes('frs') || text.includes('anpr') || text.includes('gis') || text.includes('fusion') || text.includes('war room')) {
        return createConferenceSuite(x, z, 2.7, 1.4, 4);

      if (text.includes('cyber') || text.includes('dark web') || text.includes('osint') || text.includes('social') || text.includes('threat') || text.includes('hunting')) {
        return createWorkstation(x, z, rotY, { width: 1.8, screens: 2, screenGlow: furnitureMats.screenGlowAmber, personRole: 'police' });

      if (text.includes('banking') || text.includes('telecom') || text.includes('aggregator') || text.includes('crypto') || text.includes('forensic') || text.includes('natgrid') || text.includes('i4c')) {
        return createWorkstation(x, z, rotY, { width: 1.8, screens: 2, screenGlow: furnitureMats.screenGlowGreen, personRole: 'analyst' });

      if (text.includes('data centre') || text.includes('server') || text.includes('noc') || text.includes('network')) {

      if (text.includes('director') || text.includes('finance') || text.includes('hr') || text.includes('legal') || text.includes('procurement') || text.includes('office')) {
        return createWorkstation(x, z, rotY, { width: 2.1, depth: 0.8, screens: 2, isExecutive: true, personRole: 'executive', screenGlow: furnitureMats.screenGlowAmber });
      }
      if (text.includes('training') || text.includes('innovation') || text.includes('research') || text.includes('conference') || text.includes('lab')) {

        dish.position.set(0, 2.4, 0);

        forenBench.add(microscope);
        group.add(forenBench);

        group.add(createWorkstation(4.0, -2.8, 0, { screens: 2, screenGlow: furnitureMats.screenGlowGreen, personRole: 'police' }));

      } else if (level === 7) {
        // 6TH FLOOR: Technology Operations Centre & Data Centre
        for (let row = 0; row < 2; row++) {
          for (let col = 0; col < 3; col++) {
            group.add(createDetailedServerRack(-4.6 + col * 1.1, -3.2 + row * 1.5, 0));
          }
        }

        group.add(createHumanFigure({ x: -2.8, y: 0, z: -2.4, rotY: -Math.PI / 2, isSitting: false, role: 'analyst' }));
        group.add(createWorkstation(0, 2.6, Math.PI, { width: 1.8, screens: 2, screenGlow: furnitureMats.screenGlowCyan, personRole: 'analyst' }));
        group.add(createWorkstation(2.4, 2.6, Math.PI, { width: 1.8, screens: 2, screenGlow: furnitureMats.screenGlowGreen, personRole: 'analyst' }));
        group.add(createWorkstation(-2.4, 2.6, Math.PI, { width: 1.8, screens: 2, screenGlow: furnitureMats.screenGlowAmber, personRole: 'police' }));
        group.add(createWorkstation(4.2, -2.4, 0, { screens: 1, screenGlow: furnitureMats.screenGlowCyan, personRole: 'analyst' }));

      } else if (level === 8) {
        // 7TH FLOOR: S4C Administration Coordination Centre
        const dirDesk = createWorkstation(3.8, 2.5, Math.PI, {
          width: 2.2,
          depth: 0.9,
          screens: 2,
          isExecutive: true,
          personRole: 'executive',
          screenGlow: furnitureMats.screenGlowAmber
        });
        group.add(createErgonomicChair(3.0, 1.4, 0, true));
        group.add(createHumanFigure({ x: 3.0, z: 1.4, rotY: 0, isSitting: true, role: 'police' }));
        group.add(createErgonomicChair(4.6, 1.4, 0, true));
        group.add(createHumanFigure({ x: 4.6, z: 1.4, rotY: 0, isSitting: true, role: 'police' }));
        group.add(dirDesk);

        group.add(createWorkstation(3.8, -2.5, 0, { width: 2.0, screens: 2, isExecutive: true, personRole: 'police', screenGlow: furnitureMats.screenGlowCyan }));
        group.add(createErgonomicChair(3.8, -1.4, Math.PI, true));
        group.add(createHumanFigure({ x: 3.8, z: -1.4, rotY: Math.PI, isSitting: true, role: 'executive' }));

        group.add(createWorkstation(-4.0, 2.5, Math.PI, { screens: 1, screenGlow: furnitureMats.screenGlowGreen, personRole: 'analyst' }));
        group.add(createWorkstation(-4.0, -2.5, 0, { screens: 1, screenGlow: furnitureMats.screenGlowCyan, personRole: 'analyst' }));

      } else if (level === 9) {
        // 8TH FLOOR: Training, Research & Innovation Centre
        for (let row = 0; row < 3; row++) {
          const tRow = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.58, 0.65), furnitureMats.woodDesk);
          tRow.position.set(3.5, 0.29, -3.2 + row * 1.5);
          group.add(tRow);

          [-1.3, 0, 1.3].forEach(sx => {
            const lap = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 0.22), furnitureMats.screenBezel);
            lap.position.set(3.5 + sx, 0.60, -3.2 + row * 1.5);
            const lapScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.28, 0.18), furnitureMats.screenGlowCyan);
            lapScreen.position.set(3.5 + sx, 0.72, -3.2 + row * 1.5 - 0.1);
            group.add(lap, lapScreen);
            group.add(createErgonomicChair(3.5 + sx, -3.2 + row * 1.5 + 0.44, 0, false));

            group.add(createHumanFigure({
              x: 3.5 + sx,
              z: -3.2 + row * 1.5 + 0.38,
              rotY: 0,
              isSitting: true,
              role: row % 2 === 0 ? 'police' : 'analyst'
            }));
          });
        }

        const podium = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 0.5), furnitureMats.executiveWood);
        podium.position.set(3.5, 0.5, -4.6);
        group.add(podium);
        group.add(createHumanFigure({ x: 3.5, y: 0, z: -4.8, rotY: 0, isSitting: false, role: 'police' }));

        group.add(createConferenceSuite(-3.6, 2.5, 3.6, 1.6, 10));
        group.add(createWorkstation(-3.6, -2.5, 0, { screens: 2, screenGlow: furnitureMats.screenGlowAmber, personRole: 'analyst' }));
      }

      const markerData = (FLOORS_DATA[level] && FLOORS_DATA[level].markers) || [];
      markerData.forEach((marker, index) => {
        const rot = index % 2 === 0 ? 0 : Math.PI / 2;
        group.add(createMarkerObjectByName(marker.name, marker.pos.x, marker.pos.z, rot));
      });
    }

    function buildTerraceInfra() {
      const topY = TOTAL_LEVELS * (FLOOR_H + 0.2) + 0.1;
      roofGroup = new THREE.Group();
      roofGroup.position.set(0, topY, 0);

      const mast1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.0, 8), new THREE.MeshStandardMaterial({ color: 0x94a3b8 }));
      mast1.position.set(-4, 1.5, -3.5);
      const dish1 = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 8, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0xf8fafc, side: THREE.DoubleSide }));
      dish1.rotation.x = Math.PI / 3;
      dish1.position.set(-4, 2.8, -3.5);
      roofGroup.add(mast1, dish1);

      const rfTower = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.25, 5.0, 6), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
      rfTower.position.set(4, 2.5, -3.5);
      roofGroup.add(rfTower);

      scene.add(roofGroup);
    }

    function render3DBadges(markers) {
      const container = document.getElementById('labels-container');
      if (!container) return;
      container.innerHTML = '';
      createdLabelDoms = [];

      if (!markers || markers.length === 0) return;

      markers.forEach(marker => {
        const wrapper = document.createElement('div');
        wrapper.className = 'room-tag-3d badge-pop';

        const bubble = document.createElement('div');
        bubble.className = `room-tag-bubble ${marker.color || 'bg-slate-800 text-white'}`;
        bubble.innerHTML = `<i class="fa-solid ${marker.icon || 'fa-location-dot'} text-[9px]"></i><span>${marker.name}</span>`;

        const pin = document.createElement('div');
        pin.className = 'room-tag-pin';

        const dot = document.createElement('div');
        dot.className = 'room-tag-dot';

        wrapper.appendChild(bubble);
        wrapper.appendChild(pin);
        wrapper.appendChild(dot);
        container.appendChild(wrapper);

        createdLabelDoms.push({
          dom: wrapper,
          pos3D: new THREE.Vector3(marker.pos.x, marker.pos.y, marker.pos.z)
        });
      });
    }

    function updateProjectedLabels() {
      const container = document.getElementById('canvas-container');
      if (!container || createdLabelDoms.length === 0) return;
      const w = container.clientWidth;
      const h = container.clientHeight;

      createdLabelDoms.forEach(item => {
        const v = item.pos3D.clone();
        v.project(camera);

        if (v.z > 1) {
          item.dom.style.opacity = '0';
          return;
        }

        const sx = (v.x * 0.5 + 0.5) * w;
        const sy = (-(v.y * 0.5) + 0.5) * h;

        item.dom.style.opacity = '1';
        item.dom.style.left = `${sx}px`;
        item.dom.style.top = `${sy}px`;
      });
    }

    function setFloorStage(stageId) {
      currentFloorId = stageId;
      const data = FLOORS_DATA.find(f => f.id === stageId) || FLOORS_DATA[0];

      // Update Nav Buttons
      document.querySelectorAll('.stage-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-slate-950', 'font-bold');
        btn.classList.add('text-slate-300');
      });
      const activeBtn = document.getElementById(`btn-${stageId}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-amber-500', 'text-slate-950', 'font-bold');
        activeBtn.classList.remove('text-slate-300');
      }

      // Update Details Text
      document.getElementById('floor-title').textContent = data.name;
      document.getElementById('floor-subunits').textContent = data.subUnits;
      const progressPct = (stageId / (FLOORS_DATA.length - 1)) * 100;
      document.getElementById('construction-progress-bar').style.width = `${progressPct}%`;

      // Update Top HUD Banner
      const levelShortCode = stageId === 0 ? "B" : stageId === 1 ? "G" : stageId === 10 ? "ROOF" : `${stageId - 1}F`;
      document.getElementById('floor-badge-number').textContent = levelShortCode;
      
      const splitName = data.name.split(':');
      const floorHeaderTitle = splitName[0].trim();
      const floorSubtitle = splitName.length > 1 ? splitName[1].trim() : data.name;

      document.getElementById('floor-badge-level').textContent = `● ACTIVE FLOOR: ${floorHeaderTitle}`;
      document.getElementById('floor-badge-name').textContent = floorSubtitle;

      // Construction Visibility: Progressive building from BASEMENT upwards
      floorGroups.forEach((group, idx) => {
        if (stageId === 10) {
          group.visible = true;
          floorCeilings[idx].visible = true;
        } else {
          const isBuilt = idx <= stageId;
          group.visible = isBuilt;

          if (isBuilt) {
            floorCeilings[idx].visible = (idx !== stageId);

            if (!group.userData.hasAnimated) {
              group.position.y = group.userData.defaultY + 2.0;
              new TWEEN.Tween(group.position)
                .to({ y: group.userData.defaultY }, 600)
                .easing(TWEEN.Easing.Back.Out)
                .start();
              group.userData.hasAnimated = true;
            }
          } else {
            group.userData.hasAnimated = false;
          }
        }
      });

      if (roofGroup) roofGroup.visible = (stageId === 10);

      // Rotate Crane to actively point at construction
      if (craneJib) {
        new TWEEN.Tween(craneJib.rotation)
          .to({ y: data.craneAngle }, 1200 / speed)
          .easing(TWEEN.Easing.Quadratic.InOut)
          .start();
      }

      // Smooth Camera Glide
      const transitionDuration = 1350 / speed;
      new TWEEN.Tween(camera.position)
        .to(data.cam, transitionDuration)
        .easing(TWEEN.Easing.Quartic.InOut)
        .start();

      new TWEEN.Tween(controls.target)
        .to(data.look, transitionDuration)
        .easing(TWEEN.Easing.Quartic.InOut)
        .start();

      // Update Pie-chart style leader line text
      updateLeaderLineContent(stageId, data);

      // Render 3D In-Scene Room Badges
      render3DBadges(data.markers);
    }

    function updateLeaderLineContent(stageId, data) {
      const card = document.getElementById('leader-card');
      const badge = document.getElementById('leader-level-badge');
      const title = document.getElementById('leader-level-title');
      const subtitle = document.getElementById('leader-unit-subtitle');

      if (!card || !data) return;

      const levelCode = stageId === 0 ? "B" : stageId === 1 ? "G" : stageId === 10 ? "ROOF" : `${stageId - 1}F`;
      badge.textContent = levelCode;

      const parts = data.name.split(':');
      title.textContent = parts[0].trim();
      subtitle.textContent = parts.length > 1 ? parts[1].trim() : data.name;

      card.classList.remove('hidden');
    }

    function updateLeaderLine() {
      if (currentFloorId > 10) return;

      const container = document.getElementById('canvas-container');
      if (!container) return;
      const w = container.clientWidth;
      const h = container.clientHeight;

      const activeGroup = (currentFloorId === 10 && roofGroup) ? roofGroup : floorGroups[currentFloorId];
      if (!activeGroup) return;

      const slabY = activeGroup.position.y + 0.15;
      const anchor3D = new THREE.Vector3(-SLAB_W / 2 + 0.8, slabY, SLAB_L / 2 - 0.4);
      anchor3D.project(camera);

      const pathEl = document.getElementById('callout-leader-path');
      const dotEl = document.getElementById('callout-anchor-dot');
      const pulseEl = document.getElementById('callout-anchor-pulse');
      const card = document.getElementById('leader-card');

      if (anchor3D.z > 1) {
        if (card) card.style.opacity = '0';
        if (pathEl) pathEl.setAttribute('d', '');
        if (dotEl) {
          dotEl.setAttribute('r', '0');
          dotEl.setAttribute('cx', '0');
          dotEl.setAttribute('cy', '0');
          dotEl.setAttribute('opacity', '0');
        }
        if (pulseEl) {
          pulseEl.setAttribute('r', '0');
          pulseEl.setAttribute('cx', '0');
          pulseEl.setAttribute('cy', '0');
          pulseEl.setAttribute('opacity', '0');
        }
        return;
      }

      // Point A: Anchor on Slab
      const ax = (anchor3D.x * 0.5 + 0.5) * w;
      const ay = (-(anchor3D.y * 0.5) + 0.5) * h;

      if (dotEl) {
        dotEl.setAttribute('r', '4.5');
        dotEl.setAttribute('cx', ax);
        dotEl.setAttribute('cy', ay);
        dotEl.setAttribute('opacity', '1');
      }
      if (pulseEl) {
        pulseEl.setAttribute('r', '8');
        pulseEl.setAttribute('cx', ax);
        pulseEl.setAttribute('cy', ay);
        pulseEl.setAttribute('opacity', '0.75');
      }

      // Leader elbow & horizontal termination stay on one side for a stable, non-repeating callout
      const goLeft = true;
      const diagLengthX = -85;
      const diagLengthY = -45;
      const horizLength = -150;

      // Elbow Point B & Terminus Point C
      const bx = ax + diagLengthX;
      const by = ay + diagLengthY;
      const cx = bx + horizLength;
      const cy = by;

      if (pathEl) {
        pathEl.setAttribute('d', `M ${ax} ${ay} L ${bx} ${by} L ${cx} ${cy}`);
      }

      if (card) {
        card.style.opacity = '1';
        card.style.transform = 'translate(-100%, -50%)';
        card.style.left = `${cx - 8}px`;
        card.style.top = `${cy}px`;
      }

      renderAllFloorLines(w, h);
    }

    function renderAllFloorLines(w, h) {
      const group = document.getElementById('all-floors-lines-group');
      if (!group) return;
      group.innerHTML = '';

      if (!showAllFloorLines) return;

      floorGroups.forEach((fg, idx) => {
        if (!fg.visible || idx === currentFloorId) return;

        const slabY = fg.position.y + 0.15;
        const p3d = new THREE.Vector3(-SLAB_W / 2 + 0.8, slabY, SLAB_L / 2 - 0.4);
        p3d.project(camera);

        if (p3d.z > 1) return;

        const sx = (p3d.x * 0.5 + 0.5) * w;
        const sy = (-(p3d.y * 0.5) + 0.5) * h;

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        line.setAttribute('class', 'callout-line-secondary');
        line.setAttribute('d', `M ${sx} ${sy} L ${sx - 45} ${sy - 20} L ${sx - 110} ${sy - 20}`);

        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', sx);
        dot.setAttribute('cy', sy);
        dot.setAttribute('r', '3');
        dot.setAttribute('fill', '#94a3b8');

        group.appendChild(dot);
        group.appendChild(line);
      });
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('play-btn');
      const playIcon = document.getElementById('play-icon');
      const playText = document.getElementById('play-text');
      const timerContainer = document.getElementById('tour-timer-container');
      const countdownChip = document.getElementById('countdown-chip');

      if (isPlaying) {
        playIcon.className = "fa-solid fa-pause text-[10px]";
        playText.textContent = "Pause";
        btn.classList.replace('bg-amber-500', 'bg-cyan-400');
        timerContainer.classList.remove('hidden');
        countdownChip.classList.remove('hidden');

        // Start from Basement if already at completion
        if (currentFloorId === 10) {
          setFloorStage(0);
        }
        startDwellTimer();
      } else {
        playIcon.className = "fa-solid fa-play text-[10px]";
        playText.textContent = "Play Tour";
        btn.classList.replace('bg-cyan-400', 'bg-amber-500');
        timerContainer.classList.add('hidden');
        countdownChip.classList.add('hidden');
        clearTimeout(playTimer);
        clearInterval(countdownInterval);
      }
    }

    function startDwellTimer() {
      clearTimeout(playTimer);
      clearInterval(countdownInterval);

      const adjustedDwell = DWELL_TIME_MS / speed;
      dwellStart = Date.now();
      const timerBar = document.getElementById('tour-timer-bar');
      const countdownDisplay = document.getElementById('countdown-display');

      if (timerBar) timerBar.style.width = '0%';

      // 5.0s countdown ticker
      countdownInterval = setInterval(() => {
        if (!isPlaying) {
          clearInterval(countdownInterval);
          return;
        }
        const elapsed = Date.now() - dwellStart;
        const progress = Math.min(1, elapsed / adjustedDwell);
        if (timerBar) timerBar.style.width = `${progress * 100}%`;

        const remainingSec = Math.max(0, (adjustedDwell - elapsed) / 1000).toFixed(1);
        if (countdownDisplay) countdownDisplay.textContent = `${remainingSec}s`;

        if (progress >= 1) {
          clearInterval(countdownInterval);
        }
      }, 50);

      // Glide to the next floor after 5 seconds
      playTimer = setTimeout(() => {
        if (isPlaying) {
          let next = (currentFloorId + 1) % FLOORS_DATA.length;
          setFloorStage(next);
          startDwellTimer();
        }
      }, adjustedDwell);
    }

    function nextFloor() {
      const nextIdx = (currentFloorId + 1) % FLOORS_DATA.length;
      setFloorStage(nextIdx);
      if (isPlaying) startDwellTimer();
    }

    function prevFloor() {
      const prevIdx = (currentFloorId - 1 + FLOORS_DATA.length) % FLOORS_DATA.length;
      setFloorStage(prevIdx);
      if (isPlaying) startDwellTimer();
    }

    function toggleExplode() {
      isExploded = !isExploded;
      const btn = document.getElementById('explode-btn');
      btn.classList.toggle('bg-cyan-500/20');
      btn.classList.toggle('border-cyan-400');

      const mult = isExploded ? 2.4 : 1.0;
      floorGroups.forEach((group, idx) => {
        const targetY = idx * (FLOOR_H * mult + 0.2) + 0.1;
        new TWEEN.Tween(group.position)
          .to({ y: targetY }, 900)
          .easing(TWEEN.Easing.Back.Out)
          .start();
      });

      if (isExploded) {
        new TWEEN.Tween(camera.position)
          .to({ x: 38, y: 44, z: 38 }, 900)
          .easing(TWEEN.Easing.Cubic.Out)
          .start();
      }
    }

    function toggleScaffolding() {
      showScaffolding = !showScaffolding;
      scaffoldGroups.forEach(sc => sc.visible = showScaffolding);
      document.getElementById('scaffold-btn').classList.toggle('text-amber-400');
      document.getElementById('scaffold-btn').classList.toggle('text-slate-400');
    }

    function toggleRotate() {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 1.0;
      document.getElementById('rotate-btn').classList.toggle('text-amber-400');
    }

    function cycleSpeed() {
      if (speed === 1.0) speed = 1.5;
      else if (speed === 1.5) speed = 2.0;
      else speed = 1.0;
      document.getElementById('speed-chip').textContent = `${speed.toFixed(1)}x`;
    }

    function resetView() {
      setFloorStage(0);
    }

    function onResize() {
      const c = document.getElementById('canvas-container');
      camera.aspect = c.clientWidth / c.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(c.clientWidth, c.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();

      if (craneHook) {
        craneHook.rotation.z = Math.sin(Date.now() * 0.0015) * 0.03;
      }

      if (isPlaying) {
        controls.target.x += Math.sin(Date.now() * 0.001) * 0.0015;
      }

      renderer.render(scene, camera);
      updateProjectedLabels();
      updateLeaderLine();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
